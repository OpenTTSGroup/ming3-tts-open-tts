name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: '0.5b'
            cuda: '12.4.1'
            cudnn: cudnn
            torch_cuda: cu124
            torch: '2.6.0'
          - variant: tiny
            cuda: '11.8.0'
            cudnn: cudnn8
            torch_cuda: cu118
            torch: '2.7.1'

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Ensure submodules are populated
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          ls engine/ming_tts.py engine/ming_tiny/api.py

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: imgname
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgname.outputs.image }}
          tags: |
            type=raw,value=${{ matrix.variant }},enable={{is_default_branch}}
            type=sha,format=short,prefix=${{ matrix.variant }}-sha-
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MING3_VARIANT=${{ matrix.variant }}
            CUDA_VERSION=${{ matrix.cuda }}
            CUDNN_VARIANT=${{ matrix.cudnn }}
            TORCH_CUDA_TAG=${{ matrix.torch_cuda }}
            TORCH_VERSION=${{ matrix.torch }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
